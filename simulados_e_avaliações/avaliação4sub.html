<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Substitutiva - Matemagic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="exercicio.css">
</head>
<body>
    <aside class="sidebar">
        <a href="painel1.html" class="nav-item"><i class="fas fa-arrow-left"></i></a>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <a href="inicio.html" class="logo">Matemagic</a>
        </header>

        <main class="content-area">
            <div class="question-card">
                <div id="quiz-container">
                    <div class="q-header">
                        <span>Questão <strong id="current-idx">1</strong> de 10</span>
                        <span id="topic-title">Avaliação Substitutiva</span>
                    </div>

                    <div class="q-text" id="q-text">Carregando...</div>
                    <div class="options-list" id="options-container"></div>
                    
                    <button class="btn-action" id="btn-submit" onclick="validateAnswer()">Responder</button>
                    
                    <div id="feedback" class="feedback-box" style="display: none;">
                        <p id="feedback-title" style="font-weight: bold; margin-bottom: 5px;"></p>
                        <p id="feedback-msg" style="font-size: 0.95rem; line-height: 1.4; margin-bottom: 15px;"></p>
                        <button class="btn-action btn-next" onclick="loadNextQuestion()">Próxima Questão</button>
                    </div>
                </div>

                <div id="finish-screen" style="display: none;">
                    <div class="finish-icon"><i class="fas fa-graduation-cap"></i></div>
                    <div class="points-badge" id="total-points">0 XP</div>
                    <h2 class="finish-title">Avaliação Substitutiva Concluída!</h2>
                    <p class="finish-score">Parabéns por finalizar o teste de desempenho!</p>
                    <a href="painel1.html" class="btn-action btn-back">Voltar ao Painel</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const questions = [
            {
                t: `<strong>Questão 1 (ENEM)</strong><br><br>
                Leia este classificado:<br>
                <blockquote style="background: #f8fafc; border-left: 4px solid #03ad3c; padding: 15px; margin-bottom: 20px;">
                    <strong>VENDEDORES JOVENS</strong><br>
                    Fábrica de Lonas – Vendas no atacado<br>
                    <strong>Dez vagas para estudantes</strong>, 18 a 20 anos, sem experiência.<br>
                    <strong>Salário:</strong> R$ 300,00 fixo + comissão de R$ 0,50 por m² vendido.<br><br>
                    Contato: 0XX97-434211467 ou atacadista@lonaboa.com.br
                </blockquote>
                Na seleção para as vagas desse anúncio, feito por telefone ou correio eletrônico, propunha-se aos candidatos uma questão a ser resolvida na hora. Deveriam calcular seu salário no primeiro mês, se vendessem 500 m de tecido com largura de 1,40 m, e no segundo mês, se vendessem o dobro. Foram bem sucedidos os jovens que respondessem, respectivamente:`,
                o: [
                    "R$ 300,00 e R$ 500,00.",
                    "R$ 550,00 e R$ 850,00.",
                    "R$ 650,00 e R$ 1 000,00.",
                    "R$ 650,00 e R$ 1 300,00.",
                    "R$ 950,00 e R$ 1 900,00."
                ],
                c: 2,
                e: "• No primeiro mês, a área total de lona vendida é: 500 m × 1,40 m = 700 m².<br>A comissão gerada é: 700 × 0,50 = R$ 350,00. Somando ao fixo: 300 + 350 = R$ 650,00.<br>• No segundo mês, vendeu-se o dobro do tecido, logo a área também dobra (1400 m²). A comissão passa a ser R$ 700,00. O salário final será: 300 + 700 = R$ 1 000,00."
            },
            {
                t: `<strong>Questão 2 (ENEM)</strong><br><br>
                O prefeito de uma cidade deseja construir uma rodovia para dar acesso a outro município. Para isso, foi aberta uma licitação na qual concorreram duas empresas. A primeira cobrou R$ 100 000,00 por km construído (n), acrescidos de um valor fixo de R$ 350 000,00, enquanto a segunda cobrou R$ 120 000,00 por km construído (n), acrescidos de um valor fixo de R$ 150 000,00. As duas empresas apresentam o mesmo padrão de qualidade dos serviços prestados, mas apenas uma delas poderá ser contratada.<br>
                Do ponto de vista econômico, qual equação possibilitaria encontrar a extensão da rodovia que tornaria indiferente para a prefeitura escolher qualquer uma das propostas apresentadas?`,
                o: [
                    "100n + 350 = 120n + 150.",
                    "100n + 150 = 120n + 350.",
                    "100(n + 350) = 120(n + 150).",
                    "100(n + 350 000) = 120(n + 150 000).",
                    "350(n + 100 000) = 150(n + 120 000)."
                ],
                c: 0,
                e: "Para ser indiferente, o custo total das duas empresas deve ser igual. Expressando os valores em milhares de reais:<br>• Empresa 1: C₁(n) = 100n + 350<br>• Empresa 2: C₂(n) = 120n + 150<br>Igualando as duas funções lineares, obtemos a igualdade: 100n + 350 = 120n + 150."
            },
            {
                t: `<strong>Questão 3 (ENEM)</strong><br><br>
                Um experimento consiste em colocar certa quantidade de bolas de vidro idênticas em um copo com água até certo nível e medir o nível da água, conforme ilustrado na figura a seguir. Como resultado do experimento, concluiu-se que o nível da água é função do número de bolas de vidro que são colocadas dentro do copo. O quadro a seguir mostra alguns resultados do experimento realizado.<br><br>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; border: 1px solid #edf2f7; font-size: 0.9rem; text-align: center;">
                    <thead>
                        <tr style="background-color: #ecffeb; border-bottom: 2px solid #03ad3c;">
                            <th style="padding: 10px;">NÚMERO DE BOLAS (X)</th>
                            <th style="padding: 10px;">NÍVEL DE ÁGUA (Y)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 8px;">5</td>
                            <td style="padding: 8px;">6,35 cm</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 8px;">10</td>
                            <td style="padding: 8px;">6,70 cm</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 8px;">15</td>
                            <td style="padding: 8px;">7,05 cm</td>
                        </tr>
                    </tbody>
                </table>
                Qual a expressão algébrica que permite calcular o nível da água (y) em função do número de bolas (x)?`,
                o: [
                    "y = 30x.",
                    "y = 25x + 20,2.",
                    "y = 1,27x.",
                    "y = 0,7x.",
                    "y = 0,07x + 6."
                ],
                c: 4,
                e: "Anotamos a taxa de variação (coeficiente angular): a cada 5 bolas adicionadas, o nível da água sobe 0,35 cm (6,70 - 6,35). Assim, a taxa por bola é 0,35 / 5 = 0,07.<br>Substituindo na equação da reta y = ax + b com x = 5 e y = 6,35:<br>6,35 = 0,07(5) + b &rArr; 6,35 = 0,35 + b &rArr; b = 6.<br>Portanto, a equação correta é y = 0,07x + 6."
            },
            {
                t: `<strong>Questão 4 (INÉDITA)</strong><br><br>
                Arrumar a mala, imaginar o lugar, as pessoas que vamos encontrar e as possíveis situações que vamos viver, os abraços de despedida, a expectativa feliz das futuras novidades, tudo isso faz parte da viagem e é prazeroso vivê-lo.<br>
                Pensando em viajar com sua família, Tarcísio fez uma pesquisa para alugar um veículo em três locadoras e anotou as informações passadas por elas.<br><br>
                <ul>
                    <li>Locadora 1: cobra R$ 90,00 de diária mais R$ 0,25 por quilômetro rodado.</li>
                    <li>Locadora 2: cobra R$ 100,00 de diária mais R$ 0,20 por quilômetro rodado.</li>
                    <li>Locadora 3: cobra R$ 120,00 de diária sem custo adicional por quilometragem.</li>
                </ul><br>
                Para poder utilizar o veículo, a fim de se deslocar entre as cidades que deseja visitar com sua família, Tarcísio optou pela locadora 3, por ser a mais econômica para realizar a viagem.<br>
                Para que a economia seja possível, Tarcísio deverá percorrer com o veículo alugado uma quilometragem`,
                o: [
                    "inferior a 100 km.",
                    "exata de 100 km.",
                    "superior a 100 km e inferior a 120 km.",
                    "exata de 120 km.",
                    "superior a 120 km."
                ],
                c: 4,
                e: "Vamos comparar o custo das locadoras para uma diária em função dos quilômetros rodados (x):<br>• L1(x) = 90 + 0,25x<br>• L2(x) = 100 + 0,20x<br>• L3(x) = 120<br><br>Para a Locadora 3 ser mais vantajosa que a Locadora 2 (que é mais barata que a 1 em longas distâncias):<br>120 < 100 + 0,20x &rArr; 20 < 0,20x &rArr; x > 100 km.<br>Para a Locadora 3 ser mais barata que a Locadora 1:<br>120 < 90 + 0,25x &rArr; 30 < 0,25x &rArr; x > 120 km.<br>Portanto, para ela ser a mais econômica de todas, a quilometragem obrigatoriamente deve ser superior a 120 km."
            },
            {
                t: `<strong>Questão 5 (ENEM)</strong><br><br>
                Para evitar uma epidemia, a Secretaria de Saúde de uma cidade dedetizou todos os bairros, de modo a evitar a proliferação do mosquito da dengue. Sabe-se que o número f de infectados é dado pela função f(t) = -2t² + 120t (em que t é expresso em dia e t = 0 é o dia anterior à primeira infecção) e que tal expressão é válida para os 60 primeiros dias da epidemia.<br><br>
                A Secretaria de Saúde decidiu que uma segunda dedetização deveria ser feita no dia em que o número de infectados chegasse à marca de 1 600 pessoas, e uma segunda dedetização precisou acontecer.<br>
                A segunda dedetização começou no`,
                o: [
                    "19º dia.",
                    "20º dia.",
                    "29º dia.",
                    "30º dia.",
                    "60º dia."
                ],
                c: 1,
                e: "Igualamos a função a 1600: -2t² + 120t = 1600 &rArr; -2t² + 120t - 1600 = 0.<br>Dividindo tudo por -2: t² - 60t + 800 = 0.<br>Utilizando Bhaskara ou Soma e Produto, encontramos as raízes t = 20 e t = 40. Como enunciado diz que a dedetização ocorreu no dia em que o número atingiu a marca, considera-se a primeira ocorrência, ou seja, no 20º dia."
            },
            {
                t: `<strong>Questão 6 (ENEM)</strong><br><br>
                Um estudante está pesquisando o desenvolvimento de certo tipo de bactéria. Para essa pesquisa, ele utiliza uma estufa para armazenar as bactérias. A temperatura no interior dessa estufa, em graus Celsius, é dada pela expressão T(h) = -h² + 22h - 85, em que h representa as horas do dia. Sabe-se que o número de bactérias é o maior possível quando a estufa atinge sua temperatura máxima e, nesse momento, ele deve retirá-las da estufa. A tabela associa intervalos de temperatura, em graus Celsius, com as classificações: muito baixa, baixa, média, alta e muito alta.<br><br>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; border: 1px solid #edf2f7; font-size: 0.9rem; text-align: center;">
                    <thead>
                        <tr style="background-color: #f8fafc; border-bottom: 2px solid #03ad3c;">
                            <th style="padding: 8px;">INTERVALOS DE TEMPERATURA (°C)</th>
                            <th style="padding: 8px;">CLASSIFICAÇÃO</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px;">T &lt; 0</td><td>Muito baixa</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px;">0 &le; T &le; 17</td><td>Baixa</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px;">17 &lt; T &lt; 30</td><td>Média</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px;">30 &le; T &le; 43</td><td>Alta</td>
                        </tr>
                        <tr>
                            <td style="padding: 6px;">T &gt; 43</td><td>Muito Alta</td>
                        </tr>
                    </tbody>
                </table>
                Quando o estudante obtém o maior número possível de bactérias, a temperatura no interior da estufa está classificada como`,
                o: [
                    "muito baixa.",
                    "baixa.",
                    "média.",
                    "alta.",
                    "muito alta."
                ],
                c: 3,
                e: "Primeiro determinamos a hora h do vértice que gera o valor máximo: h_v = -b/(2a) = -22 / (2 * -1) = 11h.<br>Substituindo h = 11 na função para achar a temperatura máxima: T(11) = -(11)² + 22(11) - 85 = -121 + 242 - 85 = 36 °C.<br>Analisando a tabela, 36 °C está no intervalo 30 &le; T &le; 43, correspondente à classificação 'alta'."
            },
            {
                t: `<strong>Questão 7 (ENEM)</strong><br><br>
                A parte interior de uma taça foi gerada pela rotação de uma parábola em torno de um eixo z, conforme mostra a figura.<br><br>
                <img src="imagens avs/taca.jpeg" alt="Representação geométrica da taça" class="img-center"><br>
                A função real que expressa a parábola, no plano cartesiano da figura, é dada pela lei f(x) = <div class="frac"><span>3</span><span class="nominator"></span><span>2</span></div>x² - 6x + C, onde C é a medida da altura do líquido contido na taça, em centímetros. Sabe-se que o ponto V, na figura, representa o vértice da parábola, localizado sobre o eixo x.<br><br>
                Nessas condições, a altura do líquido contido na taça, em centímetros, é`,
                o: [
                    "1.",
                    "2.",
                    "4.",
                    "5.",
                    "6."
                ],
                c: 4,
                e: "Como o vértice V está localizado sobre o eixo x, a ordenada do vértice é nula (y_v = 0), o que implica que o discriminante (&Delta;) é igual a zero.<br>&Delta; = b² - 4ac = 0 &rArr; (-6)² - 4 * (3/2) * C = 0<br>36 - 6C = 0 &rArr; 6C = 36 &rArr; C = 6 cm."
            },
            {
                t: `<strong>Questão 8 (ENEM)</strong><br><br>
                Ao abrir um negócio, um microempresário descreveu suas vendas, em milhares de reais (unidade monetária brasileira), durante os dois primeiros anos. No primeiro ano, suas vendas cresceram de modo linear. Posteriormente, ele decidiu investir em propaganda, o que fez suas vendas crescerem de modo exponencial.<br><br>
                Qual é o gráfico que melhor descreve as vendas em função do tempo?`,
                o: [
 		    "<img src='imagens avs/grafico_2a.jpeg' alt='Alternativa A' style='max-height: 100px; display: inline-block; vertical-align: middle;'>",
                    "<img src='imagens avs/grafico_2b.jpeg' alt='Alternativa B' style='max-height: 100px; display: inline-block; vertical-align: middle;'>",
                    "<img src='imagens avs/grafico_2c.jpeg' alt='Alternativa C' style='max-height: 100px; display: inline-block; vertical-align: middle;'>",
                    "<img src='imagens avs/grafico_2d.jpeg' alt='Alternativa D' style='max-height: 100px; display: inline-block; vertical-align: middle;'>",
                    "<img src='imagens avs/grafico_2e.jpeg' alt='Alternativa E' style='max-height: 100px; display: inline-block; vertical-align: middle;'>"
                ],
                c: 3,
                e: "O comportamento das vendas é dividido em duas partes distintas:<br>1. No primeiro ano ($0 \\le t \\le 1$), o crescimento é linear, representado graficamente por um segmento de linha reta inclinada.<br>2. No segundo ano ($1 < t \\le 2$), o crescimento torna-se exponencial, representado por uma curva com concavidade voltada para cima que cresce de forma acelerada. O gráfico D representa perfeitamente essa transição."
            },
            {
                t: `<strong>Questão 9 (ENEM)</strong><br><br>
                A duração do efeito de alguns fármacos está relacionada à sua meia-vida, tempo necessário para que a quantidade original do fármaco no organismo se reduza à metade. A cada intervalo de tempo correspondente a uma meia-vida, a quantidade de fármaco existente no organismo no final do intervalo é igual a 50% da quantidade do início desse intervalo.<br><br>
                <img src="imagens avs/farmaco.jpeg" alt="Gráfico de decaimento por meia-vida" class="img-center"><br>
                O gráfico acima representa, de forma genérica, o que acontece com a quantidade de fármaco no organismo humano ao longo do tempo.<br><br>
                <small>F. D. Fuchs e Cher i. Wannm Pharmacologia Clínica. Rio de Janeiro: Guanabara Koogan, 1992, p.40.</small><br><br>
                A meia-vida do antibiótico Amoxicilina é de 1 hora. Assim, se uma dose desse antibiótico for injetada as 12 h em um paciente, o percentual dessa dose que restará em seu organismo às 13 h 30 min será aproximadamente de`,
                o: [
                    "10%.",
                    "15%.",
                    "25%.",
                    "35%.",
                    "50%."
                ],
                c: 3,
                e: "• O intervalo de tempo de 12 h até 13 h 30 min é de 1h30min, o que equivale a 1,5 horas.<br>• Como a meia-vida é de 1 hora, 1,5 horas equivalem a exatamente 1,5 meias-vidas.<br>• Olhando no gráfico fornecido, localizamos no eixo horizontal (número de meias-vidas) o ponto médio entre 1 e 2, isto é, 1,5. Subindo verticalmente até a curva exponencial e projetando no eixo vertical, o percentual correspondente de fármaco restante se encontra entre 30% e 40%, sendo aproximadamente igual a 35%."
            },
            {
                t: `<strong>Questão 10 (ENEM)</strong><br><br>
                O governo de uma cidade está preocupado com a possível epidemia de uma doença infectocontagiosa causada por bactéria. Para decidir que medidas tomar, deve calcular a velocidade de reprodução da bactéria. Em experiências laboratoriais de uma cultura bacteriana, inicialmente com 40 mil unidades, obteve-se a fórmula para a população:<br>
                <div style="text-align: center; margin: 15px 0; font-weight: bold; font-size: 1.1rem;">P(t) = 40 · 2<sup>3t</sup></div>
                Em que t é o tempo, em hora, e P(t) é a população, em milhares de bactérias.<br>
                Em relação à quantidade inicial de bactérias, após 20 minutos, a população será`,
                o: [
                    "reduzida a um terço.",
                    "reduzida à metade.",
                    "reduzida a dois terços.",
                    "duplicada.",
                    "triplicada."
                ],
                c: 3,
                e: "• Primeiro convertemos 20 minutos para horas, dividindo por 60: t = 20/60 = 1/3 hora.<br>• Substituindo t = 1/3 na lei de formação da função:<br>P(1/3) = 40 · 2^(3 · 1/3) = 40 · 2¹ = 80 mil.<br>• Como a população inicial era de 40 mil e passou para 80 mil, ela foi duplicada."
            }
        ];

        let currentStep = 0;
        let score = 0;
        let answered = false;

        function render() {
            answered = false;
            const q = questions[currentStep];
            document.getElementById('current-idx').innerText = currentStep + 1;
            document.getElementById('q-text').innerHTML = q.t;
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';

            document.querySelector('.q-header span:first-child').innerHTML = `Questão <strong id="current-idx">${currentStep + 1}</strong> de ${questions.length}`;

            const container = document.getElementById('options-container');
            container.innerHTML = q.o.map((opt, i) => `
                <label class="option-item" onclick="selectOpt(this, ${i})">
                    <input type="radio" name="quiz" value="${i}">
                    <span class="option-letter">${String.fromCharCode(65+i)}</span>
                    <span>${opt}</span>
                </label>
            `).join('');
        }

        function selectOpt(el, index) {
            if (answered) return;

            document.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
        }

        function validateAnswer() {
            const sel = document.querySelector('input[name="quiz"]:checked');
            if (!sel) return;

            answered = true;
            const q = questions[currentStep];
            const correct = parseInt(sel.value) === q.c;

            document.querySelectorAll('.option-item').forEach(item => {
                item.classList.add('disabled');
            });

            if (correct) score += 10; 

            const fb = document.getElementById('feedback');
            document.getElementById('btn-submit').style.display = 'none';
            fb.style.display = 'block';
            fb.style.background = correct ? '#d1fae5' : '#fee2e2';
            document.getElementById('feedback-title').innerText = correct ? '✅ Muito bem!' : '❌ Quase lá...';
            document.getElementById('feedback-msg').innerHTML = q.e;
        }

        function loadNextQuestion() {
            currentStep++;
            if (currentStep < questions.length) {
                render();
            } else {
                showFinishScreen();
            }
        }

        function showFinishScreen() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('finish-screen').style.display = 'block';
            document.getElementById('total-points').innerText = `${score} XPs`;
        }

        window.onload = render;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios - Matemagic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="exercicio.css">
</head>
<body>
    <aside class="sidebar">
        <a href="painel1.html" class="nav-item"><i class="fas fa-arrow-left"></i></a>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <a href="inicio.html" class="logo">Matemagic</a>
        </header>

        <main class="content-area">
            <div class="question-card">
                <div id="quiz-container">
                    <div class="q-header">
                        <span>Questão <strong id="current-idx">1</strong> de 10</span>
                        <span>Conceito de Função</span>
                    </div>

                    <div class="q-text" id="q-text">Carregando...</div>
                    <div class="options-list" id="options-container"></div>
                    
                    <button class="btn-action" id="btn-submit" onclick="validateAnswer()">Responder</button>
                    
                    <div id="feedback" class="feedback-box">
                        <p id="feedback-title" style="font-weight: bold; margin-bottom: 5px;"></p>
                        <p id="feedback-msg" style="font-size: 0.95rem; line-height: 1.4; margin-bottom: 15px;"></p>
                        <button class="btn-action btn-next" onclick="loadNextQuestion()">Próxima Questão</button>
                    </div>
                </div>

                <div id="finish-screen">
                    <div class="finish-icon"><i class="fas fa-star"></i></div>
                    <div class="points-badge" id="total-points">0 XP</div>
                    <h2 class="finish-title">Parabéns!</h2>
                    <p class="finish-score">Você concluiu os exercícios do tema</p>
                    <a href="unidade3.html" class="btn-action btn-back">Voltar ao Conteúdo</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const questions = [
            {
                t: `<strong>Questão 1 (ENEM)</strong><br><br>
                A figura abaixo representa o boleto de cobrança da mensalidade de uma escola, referente ao mês de junho de 2008.<br><br>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; border: 1px solid #edf2f7; font-size: 0.9rem;">
                    <tbody>
                        <tr style="background-color: #f8fafc; border-bottom: 2px solid #2d3748;">
                            <td colspan="2" style="padding: 8px;"><strong>Banco S.A.</strong></td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px; border-right: 1px solid #e2e8f0;">Local de Pagamento<br><strong>Pagável em qualquer agência bancária até a data de vencimento</strong></td>
                            <td style="padding: 6px; width: 30%;">Vencimento<br><strong>30/06/2008</strong></td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px; border-right: 1px solid #e2e8f0;">Cedente<br><strong>Escola de Ensino Médio</strong></td>
                            <td style="padding: 6px;">Agência/Cód. cedente</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px; border-right: 1px solid #e2e8f0;">Data documento<br><strong>01/06/2008</strong></td>
                            <td style="padding: 6px;">Nosso número</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px; border-right: 1px solid #e2e8f0;">Uso do banco</td>
                            <td style="padding: 6px; background-color: #f8fafc;">(=) Valor documento<br><strong>R$ 500,00</strong></td>
                        </tr>
                        <tr>
                            <td style="padding: 6px; border-right: 1px solid #e2e8f0; font-size: 0.85rem;">Instruções<br><strong>Observação: no caso de pagamento em atraso, cobrar multa de R$ 10,00 mais 40 centavos por dia de atraso.</strong></td>
                            <td style="padding: 6px; line-height: 1.8;">(-) Descontos<br>(-) Outras deduções<br>(+) Mora/Multa<br>(+) Outros acréscimos<br><strong>(=) Valor Cobrado</strong></td>
                        </tr>
                    </tbody>
                </table>
                Se M(x) é o valor, em reais, da mensalidade a ser paga, em que x é o número de dias em atraso, então`,
                o: [
                    "M(x) = 500 + 0,4x.",
                    "M(x) = 500 + 10x.",
                    "M(x) = 510 + 0,4x.",
                    "M(x) = 510 + 40x.",
                    "M(x) = 500 + 10,4x."
                ],
                c: 2,
                e: "O valor do documento é fixado em R$ 500,00. Havendo atraso (ou seja, se x > 0), adiciona-se uma taxa fixa (multa) de R$ 10,00 somada à parcela variável de R$ 0,40 por dia de atraso (0,4x). Logo, combinando os termos independentes fixos temos: 500 + 10 = 510. A equação resultante é M(x) = 510 + 0,4x."
            },
            {
                t: `<strong>Questão 2 (ENEM)</strong><br><br>
                Leia este classificado:<br>
                <blockquote style="background: #f8fafc; border-left: 4px solid #03ad3c; padding: 15px; margin-bottom: 20px;">
                    <strong>VENDEDORES JOVENS</strong><br>
                    Fábrica de Lonas – Vendas no atacado<br>
                    <strong>Dez vagas para estudantes</strong>, 18 a 20 anos, sem experiência.<br>
                    <strong>Salário:</strong> R$ 300,00 fixo + comissão de R$ 0,50 por m² vendido.<br><br>
                    Contato: 0XX97-434211467 ou atacadista@lonaboa.com.br
                </blockquote>
                Na seleção para as vagas desse anúncio, feito por telefone ou correio eletrônico, propunha-se aos candidatos uma questão a ser resolvida na hora. Deveriam calcular seu salário no primeiro mês, se vendessem 500 m de tecido com largura de 1,40 m, e no segundo mês, se vendessem o dobro. Foram bem sucedidos os jovens que respondessem, respectivamente:`,
                o: [
                    "R$ 300,00 e R$ 500,00.",
                    "R$ 550,00 e R$ 850,00.",
                    "R$ 650,00 e R$ 1 000,00.",
                    "R$ 650,00 e R$ 1 300,00.",
                    "R$ 950,00 e R$ 1 900,00."
                ],
                c: 2,
                e: "• No primeiro mês, a área total de lona vendida é: 500 m × 1,40 m = 700 m².<br>A comissão gerada é: 700 × 0,50 = R$ 350,00. Somando ao fixo: 300 + 350 = R$ 650,00.<br>• No segundo mês, vendeu-se o dobro do tecido, logo a área também dobra (1400 m²). A comissão passa a ser R$ 700,00. O salário final será: 300 + 700 = R$ 1 000,00."
            },
            {
                t: `<strong>Questão 3 (ENEM)</strong><br><br>
                Os congestionamentos de trânsito constituem um problema que aflige, todos os dias, milhares de motoristas brasileiros. O gráfico ilustra a situação, representando, ao longo de um intervalo definido de tempo, a variação da velocidade de um veículo durante um congestionamento.<br><br>
                <img src="imagens exercicio/grafico velocidade.jpeg" alt="Gráfico de velocidade por tempo" class="img-center"><br>
                Quantos minutos o veículo permaneceu imóvel ao longo do intervalo de tempo total analisado?`,
                o: [
                    "4.",
                    "3.",
                    "2.",
                    "1.",
                    "0."
                ],
                c: 2,
                e: "Para que o veículo fique imóvel, sua velocidade deve ser igual a zero. No gráfico, a velocidade é nula (toca o eixo horizontal do tempo) no intervalo que vai de t = 6 min até t = 8 min. Portanto, o tempo decorrido nessa condição é 8 - 6 = 2 minutos."
            },
            {
                t: `<strong>Questão 4 (PUC/RS)</strong><br><br>
                Num circuito elétrico em série contendo um resistor R e um indutor L, a força eletromotriz E(t) é definida por:<br>
                <div style="text-align: center; margin: 15px 0; font-family: monospace; font-size: 1.1rem;">
                    E(t) = 110, se 0 &le; t &le; 30<br>
                    E(t) = 0, se t > 30
                </div>
                O gráfico que representa corretamente essa função é`,
                o: [
                    "<img src='imagens exercicio/grafico_4a.jpeg' alt='Alternativa A' style='max-height: 100px; display: inline-block; vertical-align: middle;'>",
                    "<img src='imagens exercicio/grafico_4b.jpeg' alt='Alternativa B' style='max-height: 100px; display: inline-block; vertical-align: middle;'>",
                    "<img src='imagens exercicio/grafico_4c.jpeg' alt='Alternativa C' style='max-height: 100px; display: inline-block; vertical-align: middle;'>",
                    "<img src='imagens exercicio/grafico_4d.jpeg' alt='Alternativa D' style='max-height: 100px; display: inline-block; vertical-align: middle;'>",
                    "<img src='imagens exercicio/grafico_4e.jpeg' alt='Alternativa E' style='max-height: 100px; display: inline-block; vertical-align: middle;'>"
                ],
                c: 0,
                e: "A função é definida por duas partes constantes. De t = 0 a t = 30, a imagem permanece constante em 110 (com bolas fechadas nos extremos). Para t > 30, o valor cai instantaneamente para zero e continua constante em cima do eixo das abscissas. O gráfico da alternativa A descreve com precisão este comportamento intervalar."
            },
            {
                t: `<strong>Questão 5 (ENEM)</strong><br><br>
                O prefeito de uma cidade deseja construir uma rodovia para dar acesso a outro município. Para isso, foi aberta uma licitação na qual concorreram duas empresas. A primeira cobrou R$ 100 000,00 por km construído (n), acrescidos de um valor fixo de R$ 350 000,00, enquanto a segunda cobrou R$ 120 000,00 por km construído (n), acrescidos de um valor fixo de R$ 150 000,00. As duas empresas apresentam o mesmo padrão de qualidade dos serviços prestados, mas apenas uma delas poderá ser contratada.<br>
                Do ponto de vista econômico, qual equação possibilitaria encontrar a extensão da rodovia que tornaria indiferente para a prefeitura escolher qualquer uma das propostas apresentadas?`,
                o: [
                    "100n + 350 = 120n + 150.",
                    "100n + 150 = 120n + 350.",
                    "100(n + 350) = 120(n + 150).",
                    "100(n + 350 000) = 120(n + 150 000).",
                    "350(n + 100 000) = 150(n + 120 000)."
                ],
                c: 0,
                e: "Para ser indiferente, o custo total das duas empresas deve ser igual. Expressando os valores em milhares de reais:<br>• Empresa 1: C₁(n) = 100n + 350<br>• Empresa 2: C₂(n) = 120n + 150<br>Igualando as duas funções lineares, obtemos a igualdade: 100n + 350 = 120n + 150."
            },
            {
                t: `<strong>Questão 6 (ENEM)</strong><br><br>
                A figura representa a vista superior de uma bola de futebol americano, cuja forma é um elipsoide obtido pela rotação de uma elipse em torno do eixo das abscissas. Os valores a e b são, respectivamente, a metade do seu comprimento horizontal e a metade do seu comprimento vertical. Para essa bola, a diferença entre os comprimentos horizontal e vertical é igual à metade do comprimento vertical.<br><br>
                <img src="imagens exercicio/bola.jpeg" alt="Elipsoide da bola de futebol americano" class="img-center"><br>
                Considere que o volume aproximado dessa bola é dado por V = 4ab². O volume da bola, em função apenas de b, é dado por`,
                o: [
                    "8b³",
                    "6b³",
                    "5b³",
                    "4b³",
                    "2b³"
                ],
                c: 1,
                e: "• O comprimento horizontal total é 2a e o comprimento vertical total é 2b.<br>• Do enunciado: (2a - 2b) = (2b / 2) &rArr; 2a - 2b = b &rArr; 2a = 3b &rArr; a = 1,5b.<br>• Substituindo 'a' na fórmula do volume: V = 4 * (1,5b) * b² = 6b³."
            },
            {
                t: `<strong>Questão 7 (ENEM)</strong><br><br>
                As curvas de ofertas e de demanda de um produto representam, respectivamente, as quantidades que vendedores e consumidores estão dispostos a comercializar em função do preço do produto. Em alguns casos, essas curvas podem ser representadas por retas. Suponha que as quantidades de oferta e de demanda de um produto sejam, respectivamente, representadas pelas equações a seguir:<br>
                • Q_o = -20 + 4P<br>
                • Q_d = 46 - 2P<br><br>
                Q_o é a quantidade de oferta, Q_d é a quantidade de demanda e P é o preço do produto. Com base nessas equações, de oferta e de demanda, os economistas encontram o preço de equilíbrio de mercado, ou seja, quando Q_o e Q_d se igualam. Para a situação descrita, qual o preço de equilíbrio?`,
                o: [
                    "5.",
                    "11.",
                    "13.",
                    "23.",
                    "33."
                ],
                c: 1,
                e: "Igualando as duas funções de primeiro grau no ponto de equilíbrio (Q_o = Q_d):<br>-20 + 4P = 46 - 2P<br>4P + 2P = 46 + 20<br>6P = 66 &rArr; P = 11."
            },
            {
                t: `<strong>Questão 8 (ENEM)</strong><br><br>
                Embora o Índice de Massa Corporal (IMC) seja amplamente utilizado, existem ainda inúmeras restrições teóricas ao seu uso e às faixas de normalidade preconizadas. O Recíproco do Índice Ponderal (RIP), de acordo com o modelo alométrico, possui uma melhor fundamentação matemática, já que a massa é uma variável de dimensões cúbicas e a altura, uma variável de dimensões lineares. As fórmulas que determinam esses índices são:<br><br>
                <div style="display: flex; justify-content: space-around; background: #fff; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 15px;">
                    <div>IMC = <div class="frac"><span>massa(kg)</span><span class="nominator"></span><span>[altura (m)]²</span></div></div>
                    <div>RIP = <div class="frac"><span>altura(cm)</span><span class="nominator"></span><span>&sup3;&radic;massa (kg)</span></div></div>
                </div>
                Se uma menina, com 64 kg de massa, apresenta IMC igual a 25 kg/m², então ela possui RIP igual a`,
                o: [
                    "0,4 cm/kg¹/³",
                    "2,5 cm/kg¹/³",
                    "8 cm/kg¹/³",
                    "20 cm/kg¹/³",
                    "40 cm/kg¹/³"
                ],
                c: 4,
                e: "• Usando a fórmula do IMC para achar a altura: 25 = 64 / h² &rArr; h² = 64 / 25 &rArr; h = 8 / 5 = 1,60 m.<br>• Convertendo a altura obtida para centímetros: 1,60 m = 160 cm.<br>• Aplicando a fórmula do RIP: RIP = 160 / &sup3;&radic;64 = 160 / 4 = 40 cm/kg¹/³."
            },
            {
                t: `<strong>Questão 9 (ENEM)</strong><br><br>
                Nos processos industriais, como na indústria de cerâmica, é necessário o uso de fornos capazes de produzir elevadas temperaturas e, em muitas situações, o tempo de elevação dessa temperatura deve ser controlado, para garantir a qualidade do produto final e a economia no processo. Em uma indústria de cerâmica, o forno é programado para elevar a temperatura ao longo do tempo de acordo com a função:<br><br>
                <div style="background: #f8fafc; padding: 12px; border-radius: 8px; font-family: monospace; line-height: 1.5; margin-bottom: 15px;">
                    T(t) = (7/5)t + 20, para 0 &le; t < 100<br>
                    T(t) = (2/125)t² - (16/5)t + 320, para t &le; 100
                </div>
                Uma peça deve ser colocada nesse forno quando a temperatura for 48°C e retirada quando a temperatura for 200°C. O tempo de permanência dessa peça no forno é, em minutos, igual a`,
                o: [
                    "100.",
                    "108.",
                    "128.",
                    "130.",
                    "150."
                ],
                c: 1,
                e: "• Instante de entrada (T = 48°C): Usamos a primeira ramificação (linear), pois a temperatura máxima desse trecho aos t = 100 é 160°C. 48 = (7/5)t + 20 &rArr; 28 = 7t/5 &rArr; t_entrada = 20 min.<br>• Instante de saída (T = 200°C): Usamos a segunda parte (quadrática). 200 = (2/125)t² - (16/5)t + 320 &rArr; (2/125)t² - (16/5)t + 120 = 0. Resolvendo a equação do 2º grau para t &ge; 100, encontramos t_saída = 128 min.<br>• Tempo total de permanência: 128 - 20 = 108 minutos."
            },
            {
                t: `<strong>Questão 10 (UFPB)</strong><br><br>
                A remuneração dos operários de uma determinada fábrica é composta por um salário base x mais duas gratificações: uma de R$ 300,00 para todos os operários, e a outra, de 30% do salário base de cada operário. Considere que da remuneração de cada operário são descontados 20% relativos aos impostos e contribuições. Após esses descontos, o valor, V(x), que cada operário recebe, em função de x, está corretamente expresso por:`,
                o: [
                    "V(x) = 0,26x + 60.",
                    "V(x) = 1,04x + 240.",
                    "V(x) = 1,04x + 300.",
                    "V(x) = 1,3x + 300.",
                    "V(x) = 1,3x + 60."
                ],
                c: 1,
                e: "• Montamos primeiro a remuneração bruta total antes dos impostos: R_bruta = x + 300 + 0,30x = 1,30x + 300.<br>• Como há um desconto de 20%, o trabalhador receberá o equivalente líquido a 80% do bruto total (multiplica-se por 0,80):<br>V(x) = 0,80 * (1,30x + 300) = 1,04x + 240."
            }
        ];

        let currentStep = 0;
        let score = 0;
        let answered = false;

        function render() {
            answered = false;
            const q = questions[currentStep];
            document.getElementById('current-idx').innerText = currentStep + 1;
            document.getElementById('q-text').innerHTML = q.t;
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';

            document.querySelector('.q-header span:first-child').innerHTML = `Questão <strong id="current-idx">${currentStep + 1}</strong> de ${questions.length}`;

            const container = document.getElementById('options-container');
            container.innerHTML = q.o.map((opt, i) => `
                <label class="option-item" onclick="selectOpt(this, ${i})">
                    <input type="radio" name="quiz" value="${i}">
                    <span class="option-letter">${String.fromCharCode(65+i)}</span>
                    <span>${opt}</span>
                </label>
            `).join('');
        }

        function selectOpt(el, index) {
            if (answered) return;

            document.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
        }

        function validateAnswer() {
            const sel = document.querySelector('input[name="quiz"]:checked');
            if (!sel) return;

            answered = true;
            const q = questions[currentStep];
            const correct = parseInt(sel.value) === q.c;

            document.querySelectorAll('.option-item').forEach(item => {
                item.classList.add('disabled');
            });

            if (correct) score += 10; 

            const fb = document.getElementById('feedback');
            document.getElementById('btn-submit').style.display = 'none';
            fb.style.display = 'block';
            fb.style.background = correct ? '#d1fae5' : '#fee2e2';
            document.getElementById('feedback-title').innerText = correct ? '✅ Muito bem!' : '❌ Quase lá...';
            document.getElementById('feedback-msg').innerHTML = q.e;
        }

        function loadNextQuestion() {
            currentStep++;
            if (currentStep < questions.length) {
                render();
            } else {
                showFinishScreen();
            }
        }

        function showFinishScreen() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('finish-screen').style.display = 'block';
            document.getElementById('total-points').innerText = `${score} XPs`;
        }

        window.onload = render;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios - Matemagic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="exercicio.css">
</head>
<body>
    <aside class="sidebar">
        <a href="unidade1.html" class="nav-item"><i class="fas fa-arrow-left"></i></a>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <a href="inicio.html" class="logo">Matemagic</a>
        </header>

        <main class="content-area">
            <div class="question-card">
                <div id="quiz-container">
                    <div class="q-header">
                        <span>Questão <strong id="current-idx">1</strong> de 5</span>
                        <span>Fundamentos</span>
                    </div>

                    <div class="q-text" id="q-text">Carregando...</div>
                    <div class="options-list" id="options-container"></div>
                    
                    <button class="btn-action" id="btn-submit" onclick="validateAnswer()">Responder</button>
                    
                    <div id="feedback" class="feedback-box">
                        <p id="feedback-title" style="font-weight: bold; margin-bottom: 5px;"></p>
                        <p id="feedback-msg" style="font-size: 0.95rem; line-height: 1.4; margin-bottom: 15px;"></p>
                        <button class="btn-action btn-next" onclick="loadNextQuestion()">Próxima Questão</button>
                    </div>
                </div>

                <div id="finish-screen">
                    <div class="finish-icon"><i class="fas fa-star"></i></div>
                    <div class="points-badge" id="total-points">0 XP</div>
                    <h2 class="finish-title">Parabéns!</h2>
                    <p class="finish-score">Você concluiu os exercícios do tema.</p>
                    <a href="unidade1.html" class="btn-action btn-back">Voltar ao Conteúdo</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const questions = [
            { 
                t: `<strong>Questão 1 (ENEM/PPL ADAPTADA)</strong><br><br>
                    O Ministério da Saúde acompanha com preocupação a difusão da tuberculose no Brasil. Um sistema de vigilância baseia-se no acompanhamento sistemático das taxas de incidência dessa doença nos estados. Depois de credenciar alguns estados a receberem recursos, em 2006, passou a ser de grande importância definir prioridades para a alocação de recursos de combate e de prevenção, levando em consideração as taxas de incidência nos anos de 2000 e 2004, conforme o quadro seguinte.<br><br>
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.95rem;">
                        <thead>
                            <tr style="background-color: #ecffeb; color: #03ad3c; border-bottom: 2px solid #e5e7eb;">
                                <th style="padding: 10px; text-align: left;">ESTADO</th>
                                <th style="padding: 10px; text-align: center;">TAXA DE INCIDÊNCIA 2000</th>
                                <th style="padding: 10px; text-align: center;">TAXA DE INCIDÊNCIA 2004</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">Amapá</td><td style="padding: 10px; text-align: center;">9,0</td><td style="padding: 10px; text-align: center;">37,1</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">Amazonas</td><td style="padding: 10px; text-align: center;">72,8</td><td style="padding: 10px; text-align: center;">69,0</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">Goiás</td><td style="padding: 10px; text-align: center;">20,5</td><td style="padding: 10px; text-align: center;">16,7</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">Minas Gerais</td><td style="padding: 10px; text-align: center;">0,3</td><td style="padding: 10px; text-align: center;">27,2</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">Pernambuco</td><td style="padding: 10px; text-align: center;">43,3</td><td style="padding: 10px; text-align: center;">51,0</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">Rio de Janeiro</td><td style="padding: 10px; text-align: center;">90,7</td><td style="padding: 10px; text-align: center;">79,7</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">São Paulo</td><td style="padding: 10px; text-align: center;">45,8</td><td style="padding: 10px; text-align: center;">38,2</td></tr>
                        </tbody>
                    </table>
                    <div style="font-size: 0.8rem; color: #718096; text-align: right; margin-bottom: 15px;">Disponível em: SINAM, 2006; IBGE, Censo 2000.</div>
                    Se a prioridade na distribuição de recursos for dada ao estado que tiver maior aumento absoluto em suas taxas de incidência, ela será dada para`, 
                o: ["Amapá.", "Amazonas.", "Minas Gerais.", "Pernambuco.", "Rio de Janeiro."], 
                c: 0, 
                e: "Calculando a variação absoluta (subtração direta): Amapá aumentou 28,1 (37,1 - 9,0); Minas Gerais aumentou 26,9 (27,2 - 0,3); Pernambuco aumentou 7,7. O maior aumento absoluto foi o do Amapá." 
            },
            { 
                t: `<strong>Questão 2 (ENEM/PPL ADAPTADA)</strong><br><br>
                    Camile gosta de caminhar em uma calçada em torno de uma praça circular que possui 500 metros de extensão, localizada perto de casa. A praça, bem como alguns locais ao seu redor e o ponto de onde inicia a caminhada, estão representados na figura:<br>
                    <img src="Screenshot_20260524-023953.jpg" alt="Esquema da Praça Circular" class="img-center"><br>
                    Em uma tarde, Camile caminhou 4 125 metros, no sentido anti-horário, e parou. Qual dos locais indicados na figura é o mais próximo de sua parada?`, 
                o: ["Centro cultural.", "Drogaria.", "Lan house.", "Ponto de partida.", "Padaria."], 
                c: 4, 
                e: "Dividindo a distância total pela extensão da pista: 4125 / 500 = 8 voltas completas e sobra um resto de 125 metros. Como a pista tem 500m, 125m equivale exatamente a 1/4 de volta (ou 2/8). Caminhando no sentido anti-horário, 1/4 de volta a deixa exatamente em frente à Padaria." 
            },
            { 
                t: `<strong>Questão 3 (ENEM ADAPTADA)</strong><br><br>
                    No quadro a seguir, encontra-se a conta de água de uma mesma residência. Além do valor a pagar, a descrição mostra como calculá-lo, em função do consumo de água (em m³). Observe que, na conta de água, existe uma tarifa mínima e diferentes faixas de tarifação.<br><br>
                    <div style="text-align: center; font-weight: bold; margin-bottom: 5px;">Companhia de Saneamento</div>
                    <div style="text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem;">TARIFAS DE ÁGUA /m³</div>
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.95rem;">
                        <thead>
                            <tr style="background-color: #ecffeb; color: #03ad3c; border-bottom: 2px solid #e5e7eb;">
                                <th style="padding: 10px; text-align: left;">Faixas de consumo</th>
                                <th style="padding: 10px; text-align: center;">Tarifa</th>
                                <th style="padding: 10px; text-align: center;">Consumo</th>
                                <th style="padding: 10px; text-align: center;">Valor -</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">até 10</td><td style="padding: 10px; text-align: center;">5,50</td><td style="padding: 10px; text-align: center;">tarifa mínima</td><td style="padding: 10px; text-align: center;">5,50</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">11 a 20</td><td style="padding: 10px; text-align: center;">0,85</td><td style="padding: 10px; text-align: center;">7</td><td style="padding: 10px; text-align: center;">5,95</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">21 a 30</td><td style="padding: 10px; text-align: center;">2,13</td><td style="padding: 10px; text-align: center;">-</td><td style="padding: 10px; text-align: center;">-</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">31 a 50</td><td style="padding: 10px; text-align: center;">2,13</td><td style="padding: 10px; text-align: center;">-</td><td style="padding: 10px; text-align: center;">-</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">acima de 50</td><td style="padding: 10px; text-align: center;">2,36</td><td style="padding: 10px; text-align: center;">-</td><td style="padding: 10px; text-align: center;">-</td></tr>
                        </tbody>
                    </table>
                    Supondo que o consumo d'água duplique, o novo valor da conta será de`, 
                o: ["R$ 22,90.", "R$ 106,46.", "R$ 43,82.", "R$ 17,40.", "R$ 22,52."], 
                c: 2, 
                e: "O novo consumo é de 34 m³. O cálculo detalhado fica: Primeiros 10 m³ = R$ 5,50 (tarifa mínima). Próximos 10 m³ (faixa 11 a 20) = 10 x 0,85 = R$ 8,50. Próximos 10 m³ (faixa 21 a 30) = 10 x 2,13 = R$ 21,30. Restante de 4 m³ (faixa 31 a 50) = 4 x 2,13 = R$ 8,52. Somando tudo: 5,50 + 8,50 + 21,30 + 8,52 = R$ 43,82." 
            },
            { 
                t: `<strong>Questão 4 (ENEM)</strong><br><br>
                    Imagine uma eleição envolvendo 3 candidatos, A, B, C e 33 eleitores (votantes). Cada eleitor vota fazendo uma ordenação dos três candidatos. Os resultados são os seguintes:<br><br>
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.95rem;">
                        <thead>
                            <tr style="background-color: #ecffeb; color: #03ad3c; border-bottom: 2px solid #e5e7eb;">
                                <th style="padding: 10px; text-align: left;">ORDENAÇÃO</th>
                                <th style="padding: 10px; text-align: center;">Nº DE VOTANTES</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">ABC</td><td style="padding: 10px; text-align: center;">10</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">ACB</td><td style="padding: 10px; text-align: center;">04</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">BAC</td><td style="padding: 10px; text-align: center;">02</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">BCA</td><td style="padding: 10px; text-align: center;">07</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">CAB</td><td style="padding: 10px; text-align: center;">03</td></tr>
                            <tr style="border-bottom: 1px solid #edf2f7;"><td style="padding: 10px;">CBA</td><td style="padding: 10px; text-align: center;">07</td></tr>
                            <tr style="background-color: #f8fafc; font-weight: bold;"><td style="padding: 10px;">Total de Votantes</td><td style="padding: 10px; text-align: center;">33</td></tr>
                        </tbody>
                    </table>
                    A primeira linha do quadro descreve que 10 eleitores escolheram A em 1º lugar, B em 2º lugar, C em 3º lugar e assim por diante. Considere o sistema de eleição no qual cada candidato ganha 3 pontos quando for escolhido em 1º lugar, 2 pontos quando for escolhido em 2º lugar e 1 ponto se for escolhido em 3º lugar. O candidato que acumular mais pontos é eleito.<br><br>
                    Neste caso,`, 
                o: ["A é eleito com 66 pontos.", "A é eleito com 68 pontos.", "B é eleito com 68 pontos.", "B é eleito com 70 pontos.", "C é eleito com 68 pontos."], 
                c: 1, 
                e: "Calculando a pontuação de A: 1º lugar: (10 + 4) x 3 = 42 pontos. 2º lugar: (2 + 3) x 2 = 10 pontos. 3º lugar: (7 + 7) x 1 = 14 pontos. Total de A = 42 + 10 + 14 = 68 pontos. Fazendo o mesmo para os outros, nota-se que A vence a disputa." 
            },
            { 
                t: `<strong>Questão 5 (INÉDITA)</strong><br><br>
                    <strong>Economia global pode estagnar</strong><br>
                    Se a economia de um país cresce, em geral isso representa mais riqueza e mais empregos. Isso é medido a partir da análise de variações no Produto Interno Bruto, ou nos valores de serviços e bens produtos, em geral no período de um trimestre ou de um ano. Em razão do surto de coronavírus, a economia global pode crescer na taxa mais baixa desde 2009, segundo a Organização para a Cooperação e Desenvolvimento Econômico (OCDE), conhecida como "clube dos países ricos". A organização prevê um crescimento global de 2,4% em 2020, uma queda em relação à previsão feita em novembro, de 2,9%.<br><br>
                    Para a OCDE, se o surto for mais duradouro e intenso, ele pode derrubar essa taxa para 1,5% em 2020, em meio a fábricas fechadas e trabalhadores em casa para evitar a disseminação do vírus.<br><br>
                    <strong style="color: #2d3748;">OCDE reduz previsões de crescimento</strong><br>
                    <span style="font-size: 0.9rem; color: #718096;">PIB deve desacelerar em 2020</span><br>
                    <img src="Screenshot_20260524-024004.jpg" alt="Gráfico de Redução do PIB mundial pela OCDE" class="img-center"><br>
                    <div style="font-size: 0.8rem; color: #718096; text-align: right; margin-bottom: 15px;">Disponível em: www.bbc.com/portuguese/internacional-51766452. Acesso em: 15 jul. 2020.</div>
                    Os dados acima correspondem a uma matéria jornalística publicada no dia 7 de março de 2020. Segundo os dados desse período, pode-se considerar que`, 
                o: [
                    "O PIB do Brasil não irá desacelerar em 2020.", 
                    "A queda no PIB mundial, em relação ao previsto em novembro de 2019, será de 1,5%.", 
                    "A retração mundial, segundo a OCDE, para o caso de um surto mais duradouro, será de 1,4%.", 
                    "A Itália é o país que sofrerá mais com a retração.", 
                    "A desaceleração do PIB será superior a 3%."
                ], 
                c: 2, 
                e: "A taxa prevista inicialmente em novembro era de 2,9%. Caso o surto se tornasse mais severo e duradouro, a nova projeção seria reduzida para 1,5%. A retração (redução imposta na estimativa do crescimento) é a diferença direta entre as previsões: 2,9% - 1,5% = 1,4%." 
            }
        ];

        let currentStep = 0;
        let score = 0;
        let answered = false;

        function render() {
            answered = false;
            const q = questions[currentStep];
            document.getElementById('current-idx').innerText = currentStep + 1;
            document.getElementById('q-text').innerHTML = q.t;
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';
            
            const container = document.getElementById('options-container');
            container.innerHTML = q.o.map((opt, i) => `
                <label class="option-item" onclick="selectOpt(this, ${i})">
                    <input type="radio" name="quiz" value="${i}">
                    <span class="option-letter">${String.fromCharCode(65+i)}</span>
                    <span>${opt}</span>
                </label>
            `).join('');
        }

        function selectOpt(el, index) {
            if (answered) return; 
            
            document.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
        }

        function validateAnswer() {
            const sel = document.querySelector('input[name="quiz"]:checked');
            if (!sel) return;

            answered = true; 
            const q = questions[currentStep];
            const correct = parseInt(sel.value) === q.c;
            
            document.querySelectorAll('.option-item').forEach(item => {
                item.classList.add('disabled');
            });

            if (correct) score += 5;

            const fb = document.getElementById('feedback');
            document.getElementById('btn-submit').style.display = 'none';
            fb.style.display = 'block';
            fb.style.background = correct ? '#d1fae5' : '#fee2e2';
            document.getElementById('feedback-title').innerText = correct ? "✅ Muito bem!" : "❌ Quase lá... ";
            document.getElementById('feedback-msg').innerText = q.e;
        }

        function loadNextQuestion() {
            currentStep++;
            if (currentStep < questions.length) {
                render();
            } else {
                showFinishScreen();
            }
        }

        function showFinishScreen() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('finish-screen').style.display = 'block';
            document.getElementById('total-points').innerText = `${score} XPs`;
        }

        window.onload = render;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios - Matemagic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="exercicio.css">
</head>
<body>
    <aside class="sidebar">
        <a href="painel1.html" class="nav-item"><i class="fas fa-arrow-left"></i></a>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <a href="inicio.html" class="logo">Matemagic</a>
        </header>

        <main class="content-area">
            <div class="question-card">
                <div id="quiz-container">
                    <div class="q-header">
                        <span>Questão <strong id="current-idx">1</strong> de 13</span>
                        <span>Função Quadrática</span>
                    </div>

                    <div class="q-text" id="q-text">Carregando...</div>
                    <div class="options-list" id="options-container"></div>
                    
                    <button class="btn-action" id="btn-submit" onclick="validateAnswer()">Responder</button>
                    
                    <div id="feedback" class="feedback-box">
                        <p id="feedback-title" style="font-weight: bold; margin-bottom: 5px;"></p>
                        <p id="feedback-msg" style="font-size: 0.95rem; line-height: 1.4; margin-bottom: 15px;"></p>
                        <button class="btn-action btn-next" onclick="loadNextQuestion()">Próxima Questão</button>
                    </div>
                </div>

                <div id="finish-screen">
                    <div class="finish-icon"><i class="fas fa-star"></i></div>
                    <div class="points-badge" id="total-points">0 XP</div>
                    <h2 class="finish-title">Parabéns!</h2>
                    <p class="finish-score">Você concluiu os exercícios do tema</p>
                    <a href="unidade3.html" class="btn-action btn-back">Voltar ao Conteúdo</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const questions = [
            {
                t: `<strong>Questão 1 (ENEM)</strong><br><br>
                Um posto de combustível vende 10 000 litros de álcool por dia a R$ 1,50 cada litro. Seu proprietário percebeu que, para cada centavo de desconto que concedia por litro, eram vendidos 100 litros a mais por dia. Por exemplo, no dia em que o preço do álcool foi R$ 1,48, foram vendidos 10 200 litros.<br><br>
                Considerando x o valor, em centavos, do desconto dado no preço de cada litro, e V o valor, em R$, arrecadado por dia com a venda do álcool, então a expressão que relaciona V e x é`,
                o: [
                    "V = 10 000 + 50x - x²",
                    "V = 10 000 + 50x + x²",
                    "V = 15 000 - 50x - x²",
                    "V = 15 000 + 50x - x²",
                    "V = 15 000 - 50x + x²"
                ],
                c: 3,
                e: "O preço por litro será (1,50 - 0,01x) e a quantidade vendida será (10 000 + 100x). Multiplicando o preço pela quantidade para achar a receita V:<br>V = (1,50 - 0,01x)(10 000 + 100x)<br>V = 15 000 + 150x - 100x - x²<br>V = 15 000 + 50x - x²."
            },
            {
                t: `<strong>Questão 2 (INÉDITA)</strong><br><br>
                Hoje, o saque no voleibol é uma arma muito potente para definir um ponto. Um jogador de vôlei fez um saque em que a bola foi lançada a uma altura de 2 m do chão, com trajetória parabólica, e atingiu altura máxima bem acima da rede, como mostra a figura:<br><br>
                <img src="imagens exercicio/volei.jpeg" alt="Trajetória da bola na quadra de vôlei" class="img-center"><br>
                Considere um sistema de coordenadas cartesianas ortogonal, de tal modo que o eixo das abscissas está no plano do chão e o eixo das ordenadas está no plano da rede, e os dois eixos estão no mesmo plano que a trajetória da bola. Sabendo que a bola descreve uma trajetória com equação da parábola dada por f(x) = -<div class="frac"><span>1</span><span class="nominator"></span><span>81</span></div>x² + 3 e que a linha de zona de ataque dista 3 m da linha de meio da quadra, a altura em que a bola passou na linha de zona de ataque da quadra adversária foi aproximadamente`,
                o: [
                    "2 m.",
                    "2,5 m.",
                    "2,9 m.",
                    "3,1 m.",
                    "3,5 m."
                ],
                c: 2,
                e: "Como o eixo das ordenadas (y) está na rede (meio da quadra), a linha da zona de ataque da quadra adversária localiza-se na posição x = 3. Substituindo x = 3 na equação da trajetória:<br>f(3) = -(1/81)(3)² + 3 = -(1/81)(9) + 3 = -1/9 + 3 = -0,11 + 3 &asymp; 2,89 m. Portanto, aproximadamente 2,9 m."
            },
            {
                t: `<strong>Questão 3 (ENEM)</strong><br><br>
                A temperatura T de um forno (em graus centígrados) é reduzida por um sistema a partir do instante de seu desligamento (t=0) e varia de acordo com a expressão T(t) = -<div class="frac"><span>t²</span><span class="nominator"></span><span>4</span></div> + 400, com t em minutos. Por motivos de segurança, a trava do forno só é liberada para abertura quando o forno atinge a temperatura de 39 °C.<br><br>
                Qual o tempo mínimo de espera, em minutos, após desligar o forno, para que a porta possa ser aberta?`,
                o: [
                    "19,0.",
                    "19,8.",
                    "20,0.",
                    "38,0.",
                    "39,0."
                ],
                c: 3,
                e: "Basta igualar a função T(t) a 39 °C:<br>39 = -t²/4 + 400 &rArr; t²/4 = 400 - 39 &rArr; t²/4 = 361<br>t² = 361 * 4 &rArr; t² = 1444 &rArr; t = &radic;1444 = 38 minutos."
            },
            {
                t: `<strong>Questão 4 (ENEM)</strong><br><br>
                Atualmente existem diversas locadoras de veículos, permitindo uma concorrência saudável para o mercado, fazendo com que os preços se tornem acessíveis. Nas locadoras P e Q, o valor da diária de seus carros depende da distância percorrida, conforme o gráfico.<br><br>
                <img src="imagens exercicio/locadora.jpeg" alt="Gráfico de custos das locadoras P e Q" class="img-center"><br>
                O valor pago na locadora Q é menor ou igual àquele pago na locadora P para distâncias, em quilômetros, presentes em qual(is) intervalo(s)?`,
                o: [
                    "De 20 a 100.",
                    "De 80 a 130.",
                    "De 100 a 160.",
                    "De 0 a 20 e de 100 a 160.",
                    "De 40 a 80 e de 130 a 160."
                ],
                c: 3,
                e: "No gráfico, a linha da locadora Q está abaixo ou intercepta a linha da locadora P nos intervalos de 0 a 20 km (onde começa em 60 e se cruzam em 20) e também a partir de 100 km até o limite de 160 km analisado."
            },
            {
                t: `<strong>Questão 5 (ENEM)</strong><br><br>
                Para evitar uma epidemia, a Secretaria de Saúde de uma cidade dedetizou todos os bairros, de modo a evitar a proliferação do mosquito da dengue. Sabe-se que o número f de infectados é dado pela função f(t) = -2t² + 120t (em que t é expresso em dia e t = 0 é o dia anterior à primeira infecção) e que tal expressão é válida para os 60 primeiros dias da epidemia.<br><br>
                A Secretaria de Saúde decidiu que uma segunda dedetização deveria ser feita no dia em que o número de infectados chegasse à marca de 1 600 pessoas, e uma segunda dedetização precisou acontecer.<br>
                A segunda dedetização começou no`,
                o: [
                    "19º dia.",
                    "20º dia.",
                    "29º dia.",
                    "30º dia.",
                    "60º dia."
                ],
                c: 1,
                e: "Igualamos a função a 1600: -2t² + 120t = 1600 &rArr; -2t² + 120t - 1600 = 0.<br>Dividindo tudo por -2: t² - 60t + 800 = 0.<br>Utilizando Bhaskara ou Soma e Produto, encontramos as raízes t = 20 e t = 40. Como enunciado diz que a dedetização ocorreu no dia em que o número atingiu a marca, considera-se a primeira ocorrência, ou seja, no 20º dia."
            },
            {
                t: `<strong>Questão 6 (ENEM)</strong><br><br>
                Um estudante está pesquisando o desenvolvimento de certo tipo de bactéria. Para essa pesquisa, ele utiliza uma estufa para armazenar as bactérias. A temperatura no interior dessa estufa, em graus Celsius, é dada pela expressão T(h) = -h² + 22h - 85, em que h representa as horas do dia. Sabe-se que o número de bactérias é o maior possível quando a estufa atinge sua temperatura máxima e, nesse momento, ele deve retirá-las da estufa. A tabela associa intervalos de temperatura, em graus Celsius, com as classificações: muito baixa, baixa, média, alta e muito alta.<br><br>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; border: 1px solid #edf2f7; font-size: 0.9rem; text-align: center;">
                    <thead>
                        <tr style="background-color: #f8fafc; border-bottom: 2px solid #03ad3c;">
                            <th style="padding: 8px;">INTERVALOS DE TEMPERATURA (°C)</th>
                            <th style="padding: 8px;">CLASSIFICAÇÃO</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px;">T &lt; 0</td><td>Muito baixa</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px;">0 &le; T &le; 17</td><td>Baixa</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px;">17 &lt; T &lt; 30</td><td>Média</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 6px;">30 &le; T &le; 43</td><td>Alta</td>
                        </tr>
                        <tr>
                            <td style="padding: 6px;">T &gt; 43</td><td>Muito Alta</td>
                        </tr>
                    </tbody>
                </table>
                Quando o estudante obtém o maior número possível de bactérias, a temperatura no interior da estufa está classificada como`,
                o: [
                    "muito baixa.",
                    "baixa.",
                    "média.",
                    "alta.",
                    "muito alta."
                ],
                c: 3,
                e: "Primeiro determinamos a hora h do vértice que gera o valor máximo: h_v = -b/(2a) = -22 / (2 * -1) = 11h.<br>Substituindo h = 11 na função para achar a temperatura máxima: T(11) = -(11)² + 22(11) - 85 = -121 + 242 - 85 = 36 °C.<br>Analisando a tabela, 36 °C está no intervalo 30 &le; T &le; 43, correspondente à classificação 'alta'."
            },
            {
                t: `<strong>Questão 7 (ENEM)</strong><br><br>
                Um túnel deve ser lacrado com uma tampa de concreto. A seção transversal do túnel e a tampa de concreto têm contornos de um arco de parábola e mesmas dimensões. Para determinar o custo da obra, um engenheiro deve calcular a área sob o arco parabólico em questão. Usando o eixo horizontal no nível do chão e o eixo de simetria da parábola como eixo vertical, obteve a seguinte equação para a parábola:<br>
                y = 9 - x², sendo x e y medidos em metros.<br><br>
                Sabe-se que a área sob uma parábola como esta é igual a <div class="frac"><span>2</span><span class="nominator"></span><span>3</span></div> da área do retângulo cujas dimensões são, respectivamente, iguais à base e à altura da entrada do túnel. Qual é a área da parte frontal da tampa de concreto, em metro quadrado?`,
                o: [
                    "18.",
                    "20.",
                    "36.",
                    "45.",
                    "54."
                ],
                c: 2,
                e: "As raízes da parábola no nível do chão (y=0) são: 0 = 9 - x² &rArr; x = &plusmn;3. Portanto, a largura da base é de -3 até 3, totalizando 6 metros. A altura máxima ocorre no vértice (x=0), logo y = 9 metros.<br>A área do retângulo contorno é base * altura = 6 * 9 = 54 m².<br>A área sob a parábola será: (2/3) * 54 = 36 m²."
            },
            {
                t: `<strong>Questão 8 (ENEM)</strong><br><br>
                A Igreja de São Francisco de Assis, obra arquitetônica modernista de Oscar Niemeyer, localizada na Lagoa da Pampulha, em Belo Horizonte, possui abóbadas parabólicas. A seta na Figura 1 ilustra uma das abóbadas na entrada principal da capela. A Figura 2 fornece uma vista frontal desta abóbada, com medidas hipotéticas para simplificar os cálculos.<br><br>
                <img src="imagens exercicio/igreja.jpeg" alt="Vista frontal da abóbada da capela" class="img-center"><br>
                Qual a medida da altura H, em metros, indicado na figura 2?`,
                o: [
                    "16/3.",
                    "31/5.",
                    "25/4.",
                    "25/3.",
                    "75/2."
                ],
                c: 3,
                e: "Colocando o vértice da parábola no ponto mais alto (0, H), a equação assume a forma y = ax² + H. A base tem 5m, logo passa por (2.5, 0). A abertura interna tem 4m de largura por 3m de altura, logo suas quinas inferiores tocam a parábola nos pontos (&plusmn;2, 3).<br>Montando o sistema:<br>1) 0 = a(2,5)² + H &rArr; H = -6,25a<br>2) 3 = a(2)² + H &rArr; 3 = 4a + H<br>Substituindo H da primeira na segunda: 3 = 4a - 6,25a &rArr; 3 = -2,25a &rArr; a = -3/2,25 = -4/3.<br>Encontrando H: H = -6,25 * (-4/3) = 25/3 metros."
            },
            {
                t: `<strong>Questão 9 (ENEM/PPL ADAPTADA)</strong><br><br>
                Uma pequena fábrica vende seus bonés em pacotes com quantidades de unidades variáveis. O lucro visto é dado pela expressão L(x) = -x² + 12x - 20, em que x representa a quantidade de bonés contidos no pacote. A empresa pretende fazer um único tipo de empacotamento, obtendo um lucro máximo. Para obter o lucro máximo nas vendas, os pacotes devem conter uma quantidade de bonés igual a`,
                o: [
                    "4.",
                    "6.",
                    "9.",
                    "10.",
                    "14."
                ],
                c: 1,
                e: "Para obter a quantidade de pacotes que maximiza o lucro, calculamos a coordenada x do vértice da parábola (x_v):<br>x_v = -b / (2a) = -12 / (2 * -1) = -12 / -2 = 6 bonés."
            },
            {
                t: `<strong>Questão 10 (ENEM)</strong><br><br>
                A parte interior de uma taça foi gerada pela rotação de uma parábola em torno de um eixo z, conforme mostra a figura.<br><br>
                <img src="imagens exercicio/taca.jpeg" alt="Representação geométrica da taça" class="img-center"><br>
                A função real que expressa a parábola, no plano cartesiano da figura, é dada pela lei f(x) = <div class="frac"><span>3</span><span class="nominator"></span><span>2</span></div>x² - 6x + C, onde C é a medida da altura do líquido contido na taça, em centímetros. Sabe-se que o ponto V, na figura, representa o vértice da parábola, localizado sobre o eixo x.<br><br>
                Nessas condições, a altura do líquido contido na taça, em centímetros, é`,
                o: [
                    "1.",
                    "2.",
                    "4.",
                    "5.",
                    "6."
                ],
                c: 4,
                e: "Como o vértice V está localizado sobre o eixo x, a ordenada do vértice é nula (y_v = 0), o que implica que o discriminante (&Delta;) é igual a zero.<br>&Delta; = b² - 4ac = 0 &rArr; (-6)² - 4 * (3/2) * C = 0<br>36 - 6C = 0 &rArr; 6C = 36 &rArr; C = 6 cm."
            }
        ];

        let currentStep = 0;
        let score = 0;
        let answered = false;

        function render() {
            answered = false;
            const q = questions[currentStep];
            document.getElementById('current-idx').innerText = currentStep + 1;
            document.getElementById('q-text').innerHTML = q.t;
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';

            document.querySelector('.q-header span:first-child').innerHTML = `Questão <strong id="current-idx">${currentStep + 1}</strong> de ${questions.length}`;

            const container = document.getElementById('options-container');
            container.innerHTML = q.o.map((opt, i) => `
                <label class="option-item" onclick="selectOpt(this, ${i})">
                    <input type="radio" name="quiz" value="${i}">
                    <span class="option-letter">${String.fromCharCode(65+i)}</span>
                    <span>${opt}</span>
                </label>
            `).join('');
        }

        function selectOpt(el, index) {
            if (answered) return;

            document.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
        }

        function validateAnswer() {
            const sel = document.querySelector('input[name="quiz"]:checked');
            if (!sel) return;

            answered = true;
            const q = questions[currentStep];
            const correct = parseInt(sel.value) === q.c;

            document.querySelectorAll('.option-item').forEach(item => {
                item.classList.add('disabled');
            });

            if (correct) score += 10; 

            const fb = document.getElementById('feedback');
            document.getElementById('btn-submit').style.display = 'none';
            fb.style.display = 'block';
            fb.style.background = correct ? '#d1fae5' : '#fee2e2';
            document.getElementById('feedback-title').innerText = correct ? '✅ Muito bem!' : '❌ Quase lá...';
            document.getElementById('feedback-msg').innerHTML = q.e;
        }

        function loadNextQuestion() {
            currentStep++;
            if (currentStep < questions.length) {
                render();
            } else {
                showFinishScreen();
            }
        }

        function showFinishScreen() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('finish-screen').style.display = 'block';
            document.getElementById('total-points').innerText = `${score} XPs`;
        }

        window.onload = render;
    </script>
</body>
</html>
